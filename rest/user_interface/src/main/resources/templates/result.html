<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Payment Result</title>
</head>
<body>
  <h1>Payment Result</h1>
  <p th:if="${paymentInfo != null}">
    <h3 th:text="${paymentInfo.transactionId == 200 ? 'Payment Successful' : 'Payment Unsuccessful'}"></h3>
    <strong>Transaction Code:</strong> <span th:text="${paymentInfo.transactionId}">Transaction ID will be displayed here.</span><br/>
    <strong>Transaction Date:</strong> <span th:text="${paymentInfo.transactionDate}">Transaction Date will be displayed here.</span><br/>
  </p>
  <a href="/orderForm" th:href="@{/orderForm}">Go to new Order</a>

  <div th:insert="popup :: popupContent"></div>

  <script>
    function showPopup(message) {
      document.getElementById('popup').style.display = 'block';
      document.getElementById('popup').querySelector('h3').innerText = message;
    }

    function closePopup() {
      document.getElementById('popup').style.display = 'none';
    }

    window.onload = function() {
      var message = /*[[${paymentInfo.transactionId == 200 ? 'Payment Successful' : 'Payment Unsuccessful'}]] 'Payment Result';
      showPopup(message);
    };
  </script>
</body>
</html>
